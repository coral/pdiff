[package]
name = "pdiff"
version = "0.1.0"
edition = "2024"
description = "Render a diff in your browser using @pierre/diffs"
license = "MIT"

[[bin]]
name = "pdiff"
path = "src/main.rs"

# Size-tuned release profile. The embedded JS bundle dominates binary size, so
# we squeeze the Rust side as hard as is reasonable.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiny_http = { version = "0.12.0", default-features = false }
webbrowser = "1.2.1"

[build-dependencies]
flate2 = "1.1.9"
